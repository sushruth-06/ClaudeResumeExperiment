[project]
name = "jobsearch"
version = "0.1.0"
description = "Agentic daily job-search pipeline: source, score, tailor, deliver."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "click>=8.1",
    "anthropic>=0.40",
    "playwright>=1.45",
    "jinja2>=3.1",
    "rapidfuzz>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
jobsearch = "jobsearch.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jobsearch*"]
